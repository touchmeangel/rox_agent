name: CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Package & Dev Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Ruff - Lint & Format Check
        run: |
          ruff check .
          ruff format --check .

      - name: Bandit - Security Scan
        run: bandit -r . -f json -o bandit-report.json || true

      - name: MyPy - Type Check
        run: mypy . --ignore-missing-imports || true

      - name: Run Tests with Coverage
        run: pytest --cov --junitxml=junit.xml

  docker-deploy:
    needs: quality-checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Docker Login
        run: echo "${{ secrets.DOCKER_PSWD }}" | docker login -u "${{ secrets.DOCKER_NAME }}" --password-stdin

      - name: Build and Push
        run: |
          docker build . -t ${{ secrets.DOCKER_NAME }}/${{ vars.IMAGE_NAME }}:latest
          docker push ${{ secrets.DOCKER_NAME }}/${{ vars.IMAGE_NAME }}:latest