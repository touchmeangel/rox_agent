[project]
name = "rox-worker"
version = "0.1.0"
description = "Worker pipeline — finding vulnerabilities in the codebase and reporting them"
requires-python = ">=3.11"
dependencies = [
    "rox-core",
]

[tool.uv.sources]
rox-core = { workspace = true }

[project.scripts]
rox-worker = "rox_worker.pipeline:main"

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]