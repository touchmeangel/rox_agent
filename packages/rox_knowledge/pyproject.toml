[project]
name = "rox-knowledge"
version = "0.1.0"
description = "Shared vulnerability descriptors and tag vocabulary for the rox agent"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "rox-core",
]

[tool.uv.sources]
rox-core = { workspace = true }

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rox_knowledge = ["data/**/*.yaml"]