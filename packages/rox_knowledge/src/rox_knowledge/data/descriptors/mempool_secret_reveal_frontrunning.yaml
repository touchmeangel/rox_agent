id: mempool_secret_reveal_frontrunning
name: Front-Running via Public Mempool Secret Exposure
granularity: contract
tags:
  - secret_gated_public_call

scenario: |
  Before a transaction is included in a block, it sits in the public mempool
  (or is visible to the sequencer/searchers on an L2), and its full calldata
  is readable by anyone — that's true regardless of what the function does
  with the data once it executes. If a function's authorization check is
  "does this plaintext argument match a secret," the moment the legitimate
  caller submits their reveal transaction, the secret is exposed publicly
  and BEFORE either transaction is mined. An attacker watching the mempool
  copies the calldata into their own transaction, pays higher gas (or bundles
  same-block via a private relay), and their copy is included first —
  satisfying the identical check and taking the payout instead.

  This is narrower in WINDOW than a permanently-readable storage secret
  (onchain_secret_exposure) — it only matters the moment someone actually
  submits a reveal — but it's broader in APPLICABILITY: it doesn't require
  the secret to ever be written to storage or even survive past the single
  call. A value that's hashed, compared, and discarded in memory within one
  function is exactly as exposed as a permanent state variable, for this
  purpose, because the exposure happens at the mempool layer, not the
  storage layer.

properties:
  - id: same_tx_reveal_no_commitment
    check: |
      Find every function taking caller-supplied data that is immediately
      compared (directly or hashed) against a stored value to gate an
      irreversible action, with no PRIOR transaction that committed to
      hash(value, msg.sender, nonce) at least one block earlier. Confirm
      there's no binding to msg.sender in the check itself either — if the
      comparison is only `keccak256(input) == storedHash` with no per-caller
      binding, a copied reveal from a different address passes identically.
      The size of the payout gated matters for prioritization: a function
      paying out the contract's entire balance on a single correct guess is
      a one-shot race the instant anyone attempts it, not a repeatable risk
      that needs many observations to notice.
    confirm_with: |
      shell: rg "keccak256\(abi\.encodePacked\(" src/ -n
      shell: rg "function \w+\(.*(string|bytes32|bytes|uint256).*\)\s*(external|public)" src/ -A 15 -n
      Read each candidate function fully. Confirm the comparison result
      directly gates a `.call{value: ...}`, `_mint`, `transfer`, or similar
      action in the same call. Then check for a separate earlier commit
      step and for msg.sender/nonce binding in the check — if either is
      present, this is likely mitigated; if neither is, it's exploitable.
    severity: critical

exploitation_context: |
  Foundry tests execute deterministically, so you don't need to model gas
  auctions or a real mempool to prove this — you only need to prove that
  possessing the plaintext value before the legitimate caller's transaction
  is confirmed is sufficient to preempt them:
  1. As the legitimate user, prepare the correct reveal call but do NOT
     broadcast it yet — you're simulating them having submitted it and it
     now sitting in the mempool, calldata fully visible.
  2. As the attacker, call the same function with the identical value FIRST.
  3. Assert the attacker's call succeeds and receives the payout.
  4. Assert the legitimate user's identical, later call now reverts or
     receives nothing (secret consumed / balance already drained) — proving
     that copying visible calldata and winning the race is the entire
     attack, no cryptographic breakage required.

  Fix to verify is present before ruling this a false positive: commit-reveal
  with the commitment bound to msg.sender (hash(value, msg.sender, salt)) and
  a mandatory block delay between commit and reveal — that specifically
  breaks the copy-and-resubmit attack, because a copied reveal transaction
  from the attacker's address hashes to a different commitment than the one
  on file.

references:
  - https://swcregistry.io/docs/SWC-114
  - https://consensys.github.io/smart-contract-best-practices/attacks/front-running/