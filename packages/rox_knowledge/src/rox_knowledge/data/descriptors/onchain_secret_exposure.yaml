id: onchain_secret_exposure
name: On-Chain Exposure of Sensitive Data (Storage/Constructor)
granularity: contract
tags:
  - sensitive_private_state
  - sensitive_constructor_args

scenario: |
  The Ethereum blockchain is entirely public. The `private` and `internal` keywords 
  in Solidity only restrict access at the smart contract level (preventing other 
  contracts from easily calling them). They DO NOT encrypt or hide the data from 
  the outside world. An attacker can read any storage slot directly using RPC calls 
  (`eth_getStorageAt` / `cast storage`). Furthermore, if a secret is passed into 
  the constructor, it is permanently visible in plain text within the deployment 
  transaction's input data (appended to the end of the bytecode).

properties:
  - id: transparent_secrets
    check: |
      Look for logic that relies on a state variable or a constructor argument 
      remaining hidden to secure the contract. For example, a function like 
      `unlock(bytes32 guess)` that checks `require(guess == privatePassword)`.
      If the contract relies on this data remaining unread by external observers, 
      it is highly vulnerable.
    confirm_with: |
      shell: rg "(private|internal).*(password|secret|key|salt|seed|hash)" src/ -i -n
      shell: rg "constructor\s*\([^)]*(password|secret|key|salt|seed)" src/ -i -n
      Verify if the matched variables are used in access control, logic gates, 
      or signature generation.
    severity: high

exploitation_context: |
  To prove this vulnerability, you have two primary attack vectors:

  PATH A: Storage Vector (State Variables)
  Use Foundry's `vm.load()` to read the 'private' state directly or shell `cast storage <address> <slot>`.
  1. Calculate the storage slot `n` for the variable.
  2. Perform the read: `bytes32 data = vm.load(address(targetContract), bytes32(uint256(n)));`.
  3. Format and pass to the vulnerable function.
  
  PATH B: Deployment Vector (Constructor Arguments)
  If the secret is only passed to the constructor and not stored, or if you need 
  to extract it from the deployment payload:
  1. Identify the deployment transaction bytecode (available in deployment logs/scripts).
  2. Use your internal decode tool to extract the hidden arguments:
     shell: evm_decode_constructor "<BYTECODE>" "<TYPES>"
  3. The tool will output the exact constructor arguments. 
  4. Use these extracted values as your exploit payload in the test script.

references:
  - https://swcregistry.io/docs/SWC-136/
  - https://consensys.github.io/smart-contract-best-practices/development-recommendations/general/public-data/