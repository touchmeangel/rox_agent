id: protocol_liveness_dos
name: Protocol Liveness Denial of Service
granularity: function
tags:
  - liveness_critical_function

scenario: |
  A protocol-critical function can be made to revert through state or
  inputs influenced by an untrusted participant. Because successful
  execution is required for global protocol progress, one participant
  can indefinitely prevent unrelated users from completing the workflow.

properties:
  - id: protocol_progress_depends_on_single_execution
    check: |
      Confirm the function performs a protocol-wide action rather than an
      isolated user action. Examples include settlement, liquidation,
      reward distribution, epoch advancement, auction finalization,
      withdrawal queue processing, or batch execution.

  - id: attacker_controlled_revert
    check: |
      Confirm an attacker can intentionally trigger a revert through
      external calls, arithmetic, invalid token behavior, malformed state,
      hook execution, gas exhaustion, or other reachable conditions.

  - id: unrelated_users_blocked
    check: |
      Verify failure affects users other than the attacker.
      Reject findings where only the attacker's own operation fails.

  - id: repeatable
    check: |
      Confirm the attacker can repeat the revert whenever protocol
      progress is attempted.

exploitation_context: |
  Construct a proof of concept that repeatedly causes the vulnerable
  function to revert using attacker-controlled state.

  The root cause may include:

  - reverting receiver contracts
  - malicious ERC20/ERC721/ERC777 implementations
  - arithmetic overflow or underflow
  - division by zero
  - exhausted gas through unbounded iteration
  - malformed protocol state
  - hook callbacks

  Demonstrate that unrelated users cannot complete the protected
  workflow until privileged intervention or protocol changes occur.

references:
  - https://swcregistry.io/docs/SWC-113/