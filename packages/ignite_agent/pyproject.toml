[project]
name = "ignite-agent"
version = "0.1.0"
description = "Final wraper for all teh separate agents"
requires-python = ">=3.11"
dependencies = [
    "ignite-coordinator",
    "ignite-worker",
]

[tool.uv.sources]
ignite-coordinator = { workspace = true }
ignite-worker = { workspace = true }

[project.scripts]
ignite-agent = "ignite_agent.pipeline:main"

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]