[project]
name = "rox-agent"
version = "0.1.0"
description = "Final wraper for all teh separate agents"
requires-python = ">=3.11"
dependencies = [
    "rox-coordinator",
    "rox-worker",
]

[tool.uv.sources]
rox-coordinator = { workspace = true }
rox-worker = { workspace = true }

[project.scripts]
rox-agent = "rox_agent.pipeline:main"

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]