[project]
name = "rox-core"
version = "0.1.0"
description = "Shared LLM/tool runtime for RoX agents"
requires-python = ">=3.11"
dependencies = [
    "ddgs==9.14.4",
    "rich==15.0.0",
    "openai==2.43.0",
    "anthropic==0.109.2",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "beautifulsoup4==4.15.0",
    "playwright==1.61.0",
    "slither-analyzer==0.11.5"
]

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]