tags:
  - id: pooled_share_vault
    description: >
      Contract pools an underlying asset from multiple depositors and issues
      proportional claims (shares/receipt tokens) against the pool, where a
      claim's redeemable value is computed from a ratio of total pooled
      assets to total claims outstanding — an exchange rate that should
      appreciate as the pool earns yield. Not limited to ERC-4626: applies
      under any function/variable naming (deposit/withdraw, stake/unstake,
      enter/leave, mint/burn against a pool, provideLiquidity/
      removeLiquidity, etc.). Look for the INVARIANT — a ratio between
      "assets held" and "claims issued" that determines redemption value —
      not specific function names. ERC-4626 compliance is the most common
      concrete example, but not required for this tag to apply.

  - id: erc20
    description: >
      Contract implements the standard ERC-20 token interface
      (transfer/transferFrom/approve/balanceOf).

  - id: has_require_guards
    description: >
      Contract contains one or more require()/assert()/revert-with-condition
      statements guarding state-changing actions or access boundaries.

  - id: access_control
    description: >
      Contract has privileged functions gated by onlyOwner, role checks
      (AccessControl, Ownable), or a custom permission modifier.

  - id: oracle_dependency
    description: >
      Contract reads an external price or data feed (Chainlink, a TWAP,
      a custom oracle contract) to make decisions.

  - id: amm_spot_price_consumption
    description: >
      Contract computes a price, exchange rate, swap output, or mint/redeem
      amount directly from the instantaneous state of an AMM pool/pair
      contract — getReserves(), slot0(), or balanceOf() on a pool address —
      with no TWAP, cumulative observation window, or independent oracle
      cross-check. Do NOT apply for contracts only consuming a TWAP or a
      Chainlink-style feed; use oracle_dependency for those.

  - id: token_balanceof_accounting
    description: >
      Contract determines an internal accounting total (total pooled
      assets, total staked, collateral backing) via balanceOf(address(this))
      on an ERC-20/777/1155 token, rather than an explicitly incremented/
      decremented internal variable. Distinct from strict_balance_dependency,
      which is native ETH balance only — this is token balance.

  - id: atomically_manipulable_valuation
    description: >
      A critical valuation/price/exchange-rate calculation reads state that
      can be driven to an extreme (and back) entirely within one
      transaction — flash loan, large donation, large deposit/redeem — and
      is trusted immediately with no time-weighting, deviation clamp, or
      independent cross-check. Cross-cutting: pair with whichever tag
      describes the manipulable state itself (amm_spot_price_consumption,
      token_balanceof_accounting, pooled_share_vault, oracle_dependency).

  - id: onchain_pseudorandomness
    description: >
      Contract derives a value used for selection, allocation, ordering, or
      reward outcomes from native on-chain global variables. Tag this if the 
      contract uses block.timestamp, blockhash, block.prevrandao/difficulty, 
      block.number, or block.coinbase to generate entropy or random numbers. 
      Do NOT use this tag for external randomness oracles like Chainlink VRF.

  - id: unchecked_user_value_arithmetic
    description: >
      Contract performs arithmetic — in Solidity <0.8.0 without SafeMath, or
      inside an `unchecked { }` block in Solidity >=0.8.0 — on a value that
      is either a user-controlled/user-supplied amount, a balance, or a
      shared accounting total (totalSupply, a mapping entry, a reward
      accrual). Do NOT apply this tag when the only unchecked/unguarded
      arithmetic present is a bounded loop counter increment/decrement
      whose range is already enforced by the loop's own condition (e.g.
      `for (uint i; i < arr.length;) { unchecked { ++i; } }`) — that pattern
      cannot overflow within its own bound and is a standard gas
      optimization, not a vulnerability signal.

  - id: reserve_balance_direct_mutation
    description: >
      Contract transfers, mints, or burns a token directly against an AMM pool
      contract's own balanceOf(pool) — not through the pool's own swap() or a
      properly-accounted two-sided mint()/burn() — where that pool's pricing
      model treats its own token balance as the reserve (reserves are read via
      balanceOf() and/or made canonical via a sync()-style call). Applies to
      any constant-product or stableswap-style pool with balance-derived
      reserves, regardless of vendor: Uniswap V2, PancakeSwap V2, SushiSwap,
      Solidly/Velodrome/Aerodrome-family pairs, and similar xy=k forks.

      Do NOT apply to concentrated-liquidity pools (Uniswap V3/V4, Algebra)
      where price is an independent state variable (sqrtPriceX96 or
      equivalent) updated only through internal swap()/mint()/burn() math —
      donating or burning tokens against those pools' balances does not move
      price, though it may create a separate insolvency/accounting-mismatch
      risk worth tagging on its own. Distinct from amm_spot_price_consumption,
      which is about READING a pool's reserves; this tag is about WRITING to a
      pool's balance in a way the pool's own logic will treat as truth.

  - id: unsafe_explicit_cast
    description: >
      Contract performs an explicit type conversion between integer types —
      narrowing (uint256 -> uint128), or same-width sign change
      (uint128 -> int128) — on a value that is not independently range-
      checked (e.g. via OpenZeppelin's SafeCast) before the conversion.
      Solidity's checked-arithmetic protections (0.8.0+) apply ONLY to the
      arithmetic operators (+, -, *, /, %) and never to explicit
      conversions, which silently truncate or reinterpret bits with no
      revert regardless of compiler version.

  - id: manual_array_length_mutation
    description: >
      Contract directly modifies the `.length` property of a dynamic storage array 
      using arithmetic (e.g., `array.length--`, `array.length++`, or 
      `array.length = newLength`) rather than exclusively using `.push()` and `.pop()`.

  - id: strict_balance_dependency
    description: >
      Contract relies on `address(this).balance` for control flow, mathematical 
      invariants, or phase transitions. Apply this tag if you see `address(this).balance` 
      used with strict equality operators (`==`), used as a ceiling/threshold that 
      can revert if exceeded, or used in unchecked subtraction where a larger-than-expected 
      balance causes an underflow.

  - id: sensitive_private_state
    description: >
      Contract stores sensitive data (passwords, keys, salts, seeds, answers) in 
      state variables. Apply this tag if you see variables named with those keywords, 
      especially if they are marked `private` or `internal`, or if a function requires 
      a parameter to match one of these state variables to unlock functionality.

  - id: sensitive_constructor_args
    description: >
      Contract accepts sensitive data (passwords, keys, salts, seeds) directly as 
      arguments in its `constructor()`. Apply this tag if the constructor takes 
      parameters meant to remain hidden from the public.

  - id: upgradeable_proxy
    description: >
      Contract is deployed behind a proxy pattern (UUPS, Transparent,
      Beacon), inherits `Initializable`, or is an implementation contract 
      meant to sit behind a proxy (uses `initialize()` instead of a constructor).

  - id: priority_dependent_outcome
    description: >
      Contract contains economically significant logic whose result depends on
      WHO gets included first or WHAT ORDER transactions execute in — not on
      deterministic protocol state. Applies whether the ordering advantage comes
      from ordinary mempool visibility and gas bidding (frontrunning), private
      relay/searcher access, or transaction replay after a chain reorganization
      reshuffles already-confirmed blocks. Typical examples: first-come-first-
      served purchases, auctions, reward claims, liquidations, marketplace
      listings, mint windows, or settlement logic where the outcome would differ
      under a different execution order.

  - id: unbounded_iteration
    description: >
      Contract iterates over a storage array, mapping-derived collection, or
      dynamically growing data structure where the number of iterations depends
      on user-controlled or externally growing state. Apply this tag whenever
      execution cost grows proportionally with stored data rather than remaining
      constant.

  - id: liveness_critical_function
    description: >
      Contract exposes functionality whose primary security property is
      guaranteed progress rather than confidentiality or authorization.
      Failure or reversion of the function can prevent protocol operation,
      liquidations, settlement, withdrawals, auctions, epoch advancement,
      reward distribution, keeper execution, or similar globally important
      actions.

  - id: makes_untrusted_calls
    description: >
      Contract executes .call{value: ...}(), .delegatecall(), .transfer(),
      .send(), or calls a function on an address that is a parameter, storage
      variable, or otherwise not a compile-time-fixed, protocol-owned address.

  - id: token_hook_interaction
    description: >
      Contract calls transfer/transferFrom/send/burn/operatorSend on an
      external token contract, calls safeTransferFrom on an NFT, implements
      IERC777Recipient/IERC777Sender/IERC721Receiver/IERC1155Receiver, or has
      a receive()/fallback() that can accept ETH. Applies regardless of
      whether a reentrancy guard is present anywhere in the contract.

  - id: secret_gated_public_call
    description: >
      Contract has an external/public function that accepts a caller-supplied
      value as a parameter and compares it (directly, or via keccak256/hash)
      against a stored secret, answer, commitment, or password to authorize a
      state-changing action (withdrawal, mint, unlock, claim) within that SAME
      call. Apply this tag whenever the proof-of-knowledge and the authorized
      action happen in one transaction, with no earlier separate transaction
      that committed to a hash of (value + msg.sender + a fresh salt/nonce)
      before the value itself is ever submitted in plaintext.

  - id: unbounded_price_impact_call
    description: >
      Contract exposes a swap, deposit, mint, or redeem function executing
      against a live, moveable price (an AMM pool, a live exchange rate) but
      does not require the caller to supply a minimum-output, maximum-input,
      or deadline parameter bounding their acceptable execution price. Applies
      regardless of whether the underlying pricing math itself is correct.

  - id: signature_authorized_action
    description: >
      Contract authorizes one or more state-changing operations using an
      off-chain cryptographic signature. Apply this tag if the contract
      verifies signatures directly (e.g. `ecrecover`, OpenZeppelin `ECDSA`,
      EIP-712/EIP-191), consumes ERC-2612/Permit2/EIP-3009 permits or
      authorizations, or accepts signature parameters such as
      `bytes signature` or `(uint8 v, bytes32 r, bytes32 s)` to approve,
      execute, mint, claim, transfer, or otherwise authorize actions.

  - id: merkle_membership_verification
    description: >
      Contract verifies Merkle proofs to authorize state-changing operations
      such as claims, minting, withdrawals, whitelisting, or access control.
      Apply this tag if the contract imports or calls OpenZeppelin's
      `MerkleProof` library (including `verify`, `verifyCalldata`,
      `processProof`, or `multiProofVerify`) or implements equivalent
      Merkle proof verification logic.

  - id: manual_storage_slot_access
    description: >
      Contract manually reads or writes EVM storage slots outside Solidity's
      default storage layout. Apply this tag if the contract uses inline
      assembly (`sload`/`sstore`), fixed `bytes32` storage slot constants,
      OpenZeppelin `StorageSlot`, ERC-7201 namespaces, Diamond Storage,
      Solady storage helpers, or equivalent manual storage access patterns.

  - id: transient_storage
    description: >
      Contract uses EIP-1153 transient storage, either via Solidity `transient`
      state variables or inline assembly `tstore` / `tload`. Transient storage
      persists across every call executed within the same transaction and is
      automatically cleared only after the transaction completes.

  - id: eip1167_minimal_proxy_clone
    description: >
      Contract is deployed as, deploys, or is otherwise part of an EIP-1167
      minimal proxy ("clone") system. Apply this tag if you see the standard
      EIP-1167 runtime bytecode prefix/suffix
      (363d3d373d3d3d363d73...5af43d82803e903d91602b57fd5bf3), use of
      OpenZeppelin's `Clones` library (`clone()`, `cloneDeterministic()`,
      `predictDeterministicAddress()`), a factory contract that deploys many
      lightweight instances via `create`/`create2` which all `delegatecall`
      into a single shared, immutable implementation address, or a contract
      that inherits `Initializable` / exposes an `initialize()` function in
      place of a constructor specifically because it is meant to be deployed
      as a clone. This tag applies regardless of which role the contract
      under review plays — the FACTORY that deploys clones, the
      IMPLEMENTATION/logic contract every clone delegates to, or the clone
      instance itself.