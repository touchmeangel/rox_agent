[project]
name = "ignite-coordinator"
version = "0.1.0"
description = "Coordinator pipeline — documentation, static analysis, and reporting steps"
requires-python = ">=3.11"
dependencies = [
    "ignite-core",
]

[tool.uv.sources]
ignite-core = { workspace = true }

[project.scripts]
ignite-coordinator = "ignite_coordinator.pipeline:main"

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]